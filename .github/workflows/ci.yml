name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest # WPF のため必須
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.101 # global.json と一致
      - run: dotnet restore DesignPatternMaster.sln
      - run: dotnet build DesignPatternMaster.sln --nologo -p:TreatWarningsAsErrors=true
      - run: dotnet test DesignPatternMaster.sln --nologo
